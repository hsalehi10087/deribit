name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [pos-analysis-exe]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --name POS_Analysis --collect-all openpyxl run_pos_analysis.py

      - uses: actions/upload-artifact@v4
        with:
          name: POS_Analysis-windows
          path: dist/POS_Analysis.exe
